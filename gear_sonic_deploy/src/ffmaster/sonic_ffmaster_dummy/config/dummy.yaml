# sonic_ffmaster_dummy configuration — elbow sine test.
#
# HAL contract (verified on hardware 2026-08-04): arrays are INDEX-ordered,
# arm order = sh_pitch, sh_roll, sh_yaw, elbow, wrist_yaw, wrist_pitch,
# wrist_roll (L then R). Publish the FULL 14-element array every tick —
# partial/empty-array semantics are undocumented (runsheet open question #2),
# so we never send a short array.

topics:
  arm_state:   /aima/hal/joint/arm/state
  arm_command: /aima/hal/joint/arm/command
  # Liveness of this topic's PUBLISHER (graph query, not subscription) is the
  # MC-alive alarm. Its type doesn't exist in the x86 SDK bundle, so the node
  # never subscribes to it — presence of any publisher is the signal.
  mc_state:    /aima/mc/common/state
  # All four command topics must be publisher-free before we engage.
  all_commands:
    - /aima/hal/joint/leg/command
    - /aima/hal/joint/waist/command
    - /aima/hal/joint/arm/command
    - /aima/hal/joint/head/command

control:
  rate_hz: 500          # HAL command rate observed from the vendor MC
  engage_s: 2.0         # hold at captured pose before the sine starts

test_joint:
  index: 3              # arm[3] = left_elbow (range -2.356..0, hangs ~ -1.17)
  amplitude_rad: 0.2
  period_s: 8.0
  cycles: 4
  kp: 25.0              # below vendor/our config value of 50 for first contact
  kd: 2.0

limp_joints:            # the other 13 arm joints
  kp: 0.0
  kd: 1.0               # light damping so nothing swings freely

safety:
  clamp_rad: 0.5        # hard |target - captured_center| clamp on the test joint
  state_stale_ms: 150   # arm state older than this => damp + exit.
                        #   50 ms tripped on hardware (2026-08-06): a blocking
                        #   graph query on the single executor thread starved
                        #   state callbacks — our own latency, not the stream.
                        #   150 ms is still safe at kp25 (<1 deg of sine motion).
  discovery_settle_s: 5.0  # bus checks don't COUNT until this much uptime —
                        #   a fresh DDS graph reports 0 publishers before
                        #   discovery completes (observed: MC invisible at
                        #   t+0.5s on the real robot, negative test 2026-08-06)
  bus_free_checks: 3    # consecutive graph checks (at check_period_s) required
  check_period_s: 1.0   #   before we consider the bus free / while monitoring
                        #   (1.0 s halves post-gate graph-query load on the executor)
  exit_damp_kd: 2.0     # damping-on-exit value for all 14 joints
  exit_damp_msgs: 50    # how many damp messages to publish on exit (@rate_hz)

# Informational only — names are decoration on the wire; index is the contract.
arm_joint_names:
  - left_shoulder_pitch_joint
  - left_shoulder_roll_joint
  - left_shoulder_yaw_joint
  - left_elbow_joint
  - left_wrist_yaw_joint
  - left_wrist_pitch_joint
  - left_wrist_roll_joint
  - right_shoulder_pitch_joint
  - right_shoulder_roll_joint
  - right_shoulder_yaw_joint
  - right_elbow_joint
  - right_wrist_yaw_joint
  - right_wrist_pitch_joint
  - right_wrist_roll_joint
